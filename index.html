<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b946ff" />
    <meta name="description" content="Play 29 free browser games instantly — Snake, Tetris, Flappy Bird, Minesweeper, Wordle, Blackjack and more. No downloads, works offline. Daily challenges, leagues and tournaments." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Offline Arcade" />
    <meta property="og:title" content="Offline Arcade — Play 29 Free Browser Games" />
    <meta property="og:description" content="Play 29 free browser games instantly — no downloads, works offline. Daily challenges, leagues and tournaments." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <title>Offline Arcade — Play 29 Free Browser Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8653159950864111" crossorigin="anonymous"></script>
  </head>
  <body>
    <svg style="position:absolute;width:0;height:0" aria-hidden="true">
      <defs>
        <filter id="deuteranopia">
          <feColorMatrix type="matrix" values="
            0.625 0.375 0     0 0
            0.7   0.3   0     0 0
            0     0.3   0.7   0 0
            0     0     0     1 0" />
        </filter>
        <filter id="protanopia">
          <feColorMatrix type="matrix" values="
            0.567 0.433 0     0 0
            0.558 0.442 0     0 0
            0     0.242 0.758 0 0
            0     0     0     1 0" />
        </filter>
        <filter id="tritanopia">
          <feColorMatrix type="matrix" values="
            0.95  0.05  0     0 0
            0     0.433 0.567 0 0
            0     0.475 0.525 0 0
            0     0     0     1 0" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('arcade-cloak');
          if (!mode || mode === 'none') return;
          if (window.__ABOUT_BLANK__) return;

          var cloakUrl = localStorage.getItem('arcade-cloak-url') || '';
          var cloakTitle = localStorage.getItem('arcade-cloak-title') || 'Offline Arcade';
          var cloakFavicon = localStorage.getItem('arcade-cloak-favicon') || '';
          var base = window.location.origin;

          if (cloakTitle) document.title = cloakTitle;
          if (cloakFavicon) {
            var link = document.querySelector("link[rel~='icon']");
            if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
            link.href = cloakFavicon;
          }

          var head = document.head.innerHTML;
          head = head.replace(/(href|src)="(\/[^"]+)"/g, function(_, a, p) { return a+'="'+base+p+'"'; });
          if (cloakTitle) head = head.replace(/<title>[^<]*<\/title>/, '<title>'+cloakTitle+'</title>');
          if (cloakFavicon) head = head.replace(/<link rel="icon"[^>]*>/, '<link rel="icon" type="image/svg+xml" href="'+cloakFavicon+'" />');

          var panicSeq = localStorage.getItem('arcade-panic-sequence') || '';
          var panicUrlVal = localStorage.getItem('arcade-panic-url') || '';
          var panicScript = '';
          if (panicSeq && panicUrlVal && panicUrlVal !== 'https://') {
            panicScript = '<script>(function(){var s="' + panicSeq + '".split(","),u="' + panicUrlVal + '",b=[],t=0;document.addEventListener("keydown",function(e){var n=Date.now();if(n-t>2000)b=[];t=n;b.push(e.code);if(b.length>=s.length){var l=b.slice(-s.length);if(l.every(function(k,i){return k===s[i]})){b=[];window.location.replace(u)}})})()<\/script>';
          }
          var modScript = document.querySelector('script[type="module"]');
          var modSrc = modScript ? modScript.outerHTML.replace(/src="\/([^"]+)"/g, 'src="'+base+'/$1"') : '';
          var blankHtml = '<!doctype html><html><head>' + head + '</head><body><div id="root"></div><script>window.__ABOUT_BLANK__=true<\/script>' + panicScript + modSrc + '</body></html>';

          document.documentElement.innerHTML = '<head>' + (cloakTitle ? '<title>'+cloakTitle+'</title>' : '') + (cloakFavicon ? '<link rel="icon" href="'+cloakFavicon+'">' : '') + '<meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#111;font-family:system-ui,sans-serif}button{padding:14px 32px;border:none;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#3b82f6);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:transform .2s}button:hover{transform:scale(1.05)}</style></head><body><button id="cloak-btn">Click to Open</button></body>';
          history.replaceState(null, '', ' ');

          document.getElementById('cloak-btn').addEventListener('click', function() {
            var win = window.open('about:blank');
            if (win) { win.document.write(blankHtml); win.document.close(); }
            if (mode === 'custom' && cloakUrl && cloakUrl !== 'https://') {
              window.location.replace(cloakUrl);
            }
          });
        } catch(e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
